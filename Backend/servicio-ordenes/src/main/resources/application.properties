spring.application.name=servicio-ordenes
server.port=${PORT:8082}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_ordenes}
spring.datasource.username=${DB_USER:ecommerce_ordenes}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
server.error.include-message=never
app.productos-url=${PRODUCTOS_URL:http://localhost:8081}
app.ordenes-url=${ORDENES_URL:http://localhost:8082}
app.envios-url=${ENVIOS_URL:http://localhost:8083}
